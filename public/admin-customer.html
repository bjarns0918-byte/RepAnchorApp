<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer detail — RepAnchor Admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="Internal admin detail view for a RepAnchor customer account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213D; --paper: #F5F6F2; --card: #ffffff; --line: #E2E4DE;
    --gold: #E8A33D; --gold-light: #FBF0DC; --muted: #6B7280; --coral: #D64545; --coral-light: #FBE7E5;
    --teal: #2D9C8A; --teal-light: #E1F5F0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", -apple-system, sans-serif; line-height: 1.5; }
  a, button, input, textarea, select { transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  ::selection { background: rgba(232,163,61,0.35); color: #14213D; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .brand-mark { display: flex; align-items: center; gap: 12px; }
  .brand h1 { font-family: "Fraunces", Georgia, serif; font-size: 22px; font-weight: 600; margin: 0; }
  .back { font-size: 13px; color: var(--muted); text-decoration: none; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; margin-bottom: 20px; }
  .panel h2 { font-family: "Fraunces", Georgia, serif; font-size: 16px; margin: 0 0 14px; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .info-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 3px; }
  .info-item .value { font-size: 14px; font-weight: 500; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 10px; }
  .status-active { background: var(--teal-light); color: var(--teal); }
  .status-pending { background: var(--gold-light); color: #8a5a10; }
  .status-canceled { background: var(--coral-light); color: var(--coral); }
  .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  button { font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: none; border-radius: 7px; padding: 10px 16px; background: var(--ink); color: #fff; }
  button:hover { background: #0d1730; }
  button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--coral); border: 1px solid var(--coral-light); }
  button:disabled { background: #a3a8b5; cursor: default; }
  select, textarea { font-family: inherit; font-size: 13px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; }
  textarea { width: 100%; min-height: 90px; resize: vertical; }
  .review-card { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
  .badge.posted { background: var(--teal-light); color: var(--teal); }
  .badge.pending { background: var(--coral-light); color: var(--coral); }
  .error { font-size: 13px; color: var(--coral); background: var(--coral-light); border-radius: 7px; padding: 10px 12px; margin-bottom: 14px; display: none; }
  .success { font-size: 13px; color: var(--teal); background: var(--teal-light); border-radius: 7px; padding: 10px 12px; margin-bottom: 14px; display: none; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">
      <svg width="28" height="28" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="16" fill="#14213D"/>
        <circle cx="17" cy="9" r="2" fill="none" stroke="#E8A33D" stroke-width="1.6"/>
        <line x1="17" y1="11" x2="17" y2="20" stroke="#E8A33D" stroke-width="1.8"/>
        <line x1="13" y1="14.5" x2="21" y2="14.5" stroke="#E8A33D" stroke-width="1.8"/>
        <path d="M9.5,18 Q9.5,23 14,24" fill="none" stroke="#E8A33D" stroke-width="1.8"/>
        <path d="M24.5,18 Q24.5,23 20,24" fill="none" stroke="#E8A33D" stroke-width="1.8"/>
      </svg>
      <h1 id="pageTitle">Customer detail</h1>
    </div>
    <a href="/admin-overview.html" class="back">&larr; Back to all customers</a>
  </div>

  <div class="error" id="globalError"></div>
  <div class="success" id="globalSuccess"></div>

  <div id="content"><p class="empty">Loading...</p></div>
</div>

<script src="/toast.js"></script>
<script src="/cookie-consent.js"></script>
<script>
const businessId = new URLSearchParams(window.location.search).get('id');
let currentBusiness = null;

function flashError(msg) {
  const el = document.getElementById('globalError');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('globalSuccess').style.display = 'none';
  window.scrollTo(0, 0);
}
function flashSuccess(msg) {
  const el = document.getElementById('globalSuccess');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('globalError').style.display = 'none';
  window.scrollTo(0, 0);
}

async function load() {
  if (!businessId) {
    document.getElementById('content').innerHTML = '<p class="empty">No business specified.</p>';
    return;
  }
  const res = await fetch('/api/admin/business/' + encodeURIComponent(businessId)).then(r => r.json());
  if (!res.ok) {
    document.getElementById('content').innerHTML = `<p class="empty">${res.error}</p>`;
    return;
  }
  currentBusiness = res.business;
  document.getElementById('pageTitle').textContent = res.business.businessName;

  const statusClass = { active: 'status-active', pending: 'status-pending', canceled: 'status-canceled' };
  const b = res.business;
  const starMap = { ONE: 1, TWO: 2, THREE: 3, FOUR: 4, FIVE: 5 };

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <h2>Account</h2>
      <div class="info-grid">
        <div class="info-item"><p class="label">Email</p><p class="value">${b.email}</p></div>
        <div class="info-item"><p class="label">Plan</p><p class="value">${b.billingPlan || 'monthly'}</p></div>
        <div class="info-item"><p class="label">Status</p><p class="value"><span class="status-pill ${statusClass[b.subscriptionStatus] || 'status-pending'}">${b.subscriptionStatus}</span></p></div>
        <div class="info-item"><p class="label">Google</p><p class="value">${b.googleConnected ? 'Connected' : 'Not connected'}</p></div>
        <div class="info-item"><p class="label">Last synced</p><p class="value">${b.lastSyncedAt ? new Date(b.lastSyncedAt).toLocaleString() : '&mdash;'}</p></div>
        <div class="info-item"><p class="label">Signed up</p><p class="value">${new Date(b.createdAt).toLocaleDateString()}</p></div>
        <div class="info-item"><p class="label">Team members</p><p class="value">${b.teamMembers.length}</p></div>
        <div class="info-item"><p class="label">Digest frequency</p><p class="value">${b.digestFrequency}</p></div>
      </div>

      <div class="action-row">
        <button type="button" id="impersonateBtn">Log in as this customer</button>
        <button type="button" id="syncNowBtn" class="secondary">Sync reviews now</button>
        <button type="button" id="digestNowBtn" class="secondary">Resend digest now</button>
        <select id="statusSelect">
          <option value="active" ${b.subscriptionStatus === 'active' ? 'selected' : ''}>Active</option>
          <option value="pending" ${b.subscriptionStatus === 'pending' ? 'selected' : ''}>Pending</option>
          <option value="canceled" ${b.subscriptionStatus === 'canceled' ? 'selected' : ''}>Canceled</option>
        </select>
        <button type="button" id="saveStatusBtn" class="secondary">Save status</button>
      </div>
    </div>

    <div class="panel">
      <h2>Internal notes</h2>
      <p style="font-size:12px; color:var(--muted); margin-top:-8px;">Only visible to you - never shown to the customer.</p>
      <textarea id="adminNotes" placeholder="e.g. called 7/28 about a billing question...">${(b.adminNotes || '').replace(/</g, '&lt;')}</textarea>
      <div class="action-row"><button type="button" id="saveNotesBtn" class="secondary">Save notes</button></div>
    </div>

    <div class="panel">
      <h2>Latest digest</h2>
      ${b.latestDigest ? `
        <p style="font-size:13px;"><strong style="color:var(--teal);">What's working:</strong> ${b.latestDigest.strengths}</p>
        <p style="font-size:13px;"><strong style="color:var(--coral);">Needs improvement:</strong> ${b.latestDigest.improvements}</p>
      ` : '<p class="empty">No digest generated yet.</p>'}
    </div>

    <div class="panel">
      <h2>Reviews (${res.reviews.length})</h2>
      ${res.reviews.length === 0 ? '<p class="empty">No reviews yet.</p>' : res.reviews.slice(0, 20).map(r => `
        <div class="review-card">
          <p style="margin:0 0 6px;">${starMap[r.starRating] || '?'}&#9733; &middot; ${r.reviewer || 'A customer'}</p>
          <p style="margin:0 0 6px; font-style:italic;">"${(r.comment || '').replace(/</g, '&lt;')}"</p>
          <span class="badge ${r.status === 'posted' ? 'posted' : 'pending'}">${r.status === 'posted' ? 'Auto-posted' : 'Needs approval'}</span>
        </div>
      `).join('')}
      ${res.reviews.length > 20 ? `<p class="empty">Showing 20 of ${res.reviews.length}.</p>` : ''}
    </div>

    <div class="panel" style="border-color:var(--coral-light);">
      <h2 style="color:var(--coral);">Danger zone</h2>
      <p style="font-size:13px; color:var(--muted); margin-top:-8px;">Permanently deletes this account, cancels their billing immediately, and can't be undone.</p>
      <button type="button" id="deleteBusinessBtn" class="danger">Delete this account</button>
    </div>
  `;

  wireActions();
}

function wireActions() {
  document.getElementById('impersonateBtn').addEventListener('click', async () => {
    const res = await fetch(`/api/admin/business/${businessId}/impersonate`, { method: 'POST' }).then(r => r.json());
    if (res.ok) {
      window.location.href = '/';
    } else {
      flashError(res.error);
    }
  });

  document.getElementById('syncNowBtn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = 'Syncing...';
    const res = await fetch(`/api/admin/business/${businessId}/sync`, { method: 'POST' }).then(r => r.json());
    btn.disabled = false;
    btn.textContent = 'Sync reviews now';
    if (res.ok) { flashSuccess('Sync complete.'); load(); } else { flashError(res.error); }
  });

  document.getElementById('digestNowBtn').addEventListener('click', async (e) => {
    const btn = e.target;
    btn.disabled = true;
    btn.textContent = 'Sending...';
    const res = await fetch(`/api/admin/business/${businessId}/digest`, { method: 'POST' }).then(r => r.json());
    btn.disabled = false;
    btn.textContent = 'Resend digest now';
    if (res.ok) { flashSuccess('Digest sent.'); load(); } else { flashError(res.error); }
  });

  document.getElementById('saveStatusBtn').addEventListener('click', async () => {
    const status = document.getElementById('statusSelect').value;
    const res = await fetch(`/api/admin/business/${businessId}/status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    }).then(r => r.json());
    if (res.ok) { flashSuccess('Status updated.'); load(); } else { flashError(res.error); }
  });

  document.getElementById('saveNotesBtn').addEventListener('click', async () => {
    const notes = document.getElementById('adminNotes').value;
    const res = await fetch(`/api/admin/business/${businessId}/notes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notes })
    }).then(r => r.json());
    if (res.ok) showToast('Notes saved'); else flashError(res.error);
  });

  document.getElementById('deleteBusinessBtn').addEventListener('click', async () => {
    if (!confirm(`Permanently delete ${currentBusiness.businessName}? This cannot be undone.`)) return;
    const res = await fetch(`/api/admin/business/${businessId}/delete`, { method: 'POST' }).then(r => r.json());
    if (res.ok) {
      window.location.href = '/admin-overview.html';
    } else {
      flashError(res.error);
    }
  });
}

load();
</script>
</body>
</html>
