<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support chats — RepAnchor admin</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#14213D; --paper:#F5F6F2; --card:#fff; --line:#E2E4DE; --gold:#E8A33D; --muted:#6B7280; --coral:#D64545; --coral-light:#FBE7E5; --teal:#2D9C8A; --teal-light:#E1F5F0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",-apple-system,sans-serif; line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; padding:40px 24px 80px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px; flex-wrap:wrap; }
  h1 { font-family:"Fraunces",Georgia,serif; font-size:22px; margin:0; }
  a.back { font-size:13px; color:var(--muted); text-decoration:none; }
  .bar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .bar input, .bar select { font:inherit; font-size:13px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .bar input { flex:1; min-width:180px; }
  button { font:600 13px "IBM Plex Sans",sans-serif; background:#fff; color:var(--coral); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .chat { background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:10px; }
  .chat > summary { list-style:none; cursor:pointer; padding:12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .chat > summary::-webkit-details-marker { display:none; }
  .who { font-weight:600; font-size:14px; }
  .when { font-size:12px; color:var(--muted); margin-left:auto; }
  .first { flex-basis:100%; font-size:13px; color:#3d4659; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px; }
  .pill.handoff { background:var(--coral-light); color:var(--coral); }
  .pill.cust { background:var(--teal-light); color:var(--teal); }
  .pill.vis { background:#EEF0F4; color:var(--muted); }
  .log { padding:4px 14px 14px; border-top:1px solid var(--line); }
  .msg { margin:10px 0 0; font-size:13px; white-space:pre-wrap; }
  .msg b { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  .msg.u { background:#EEF0F4; padding:8px 11px; border-radius:8px; }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); }
  .summary { font-size:13px; color:var(--muted); margin-bottom:12px; }
  @media (max-width:600px){ .wrap{padding:24px 16px 60px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Support chats</h1><a class="back" href="/admin-overview.html">&larr; Admin overview</a></div>
  <div class="bar">
    <input type="text" id="q" placeholder="Search what people asked">
    <select id="filter"><option value="all">All chats</option><option value="handoff">Handed off to Ben</option><option value="customer">Customers</option><option value="visitor">Visitors</option></select>
    <button type="button" id="clearBtn">Delete all logs</button>
  </div>
  <div class="summary" id="summary"></div>
  <div id="list"><div class="empty">Loading...</div></div>
</div>
<script>
var chats = [];
function esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render() {
  var q = document.getElementById('q').value.trim().toLowerCase();
  var f = document.getElementById('filter').value;
  var rows = chats.filter(function (c) {
    if (f === 'handoff' && !c.handoff) return false;
    if (f === 'customer' && !c.businessId) return false;
    if (f === 'visitor' && c.businessId) return false;
    if (q && !c.messages.some(function (m) { return m.content.toLowerCase().indexOf(q) >= 0; })) return false;
    return true;
  });
  document.getElementById('summary').textContent = rows.length + ' of ' + chats.length + ' conversations. ' + chats.filter(function (c) { return c.handoff; }).length + ' were handed to you.';
  var list = document.getElementById('list');
  if (!rows.length) { list.innerHTML = '<div class="empty">No chats match.</div>'; return; }
  list.innerHTML = rows.map(function (c) {
    var first = (c.messages.find(function (m) { return m.role === 'user'; }) || {}).content || '';
    return '<details class="chat"><summary><span class="who">' + esc(c.businessName || 'Visitor') + '</span>' +
      '<span class="pill ' + (c.businessId ? 'cust' : 'vis') + '">' + (c.businessId ? 'Customer' : 'Visitor') + '</span>' +
      (c.handoff ? '<span class="pill handoff">Needs you</span>' : '') +
      '<span class="when">' + esc(new Date(c.updatedAt).toLocaleString()) + '</span><span class="first">' + esc(first) + '</span></summary>' +
      '<div class="log">' + c.messages.map(function (m) {
        return '<div class="msg ' + (m.role === 'user' ? 'u' : '') + '"><b>' + (m.role === 'user' ? 'Asked' : 'AI answered') + '</b>' + esc(m.content) + '</div>';
      }).join('') + '</div></details>';
  }).join('');
}
fetch('/api/admin/support-chats').then(function (r) { return r.json(); }).then(function (res) {
  if (!res.ok) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(res.error || 'Admin access only.') + '</div>'; return; }
  chats = res.chats; render();
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('filter').addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', function () {
  if (!confirm('Permanently delete all saved support chats?')) return;
  fetch('/api/admin/support-chats/clear', { method: 'POST' }).then(function (r) { return r.json(); }).then(function (res) { if (res.ok) { chats = []; render(); } });
});
</script>
</body>
</html>
